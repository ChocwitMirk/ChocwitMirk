<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moonie's Fun Farm</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#183729;color:#fff6df;text-align:center;font:700 1rem system-ui}a{color:inherit}</style></head>
<body><main><p id="status" role="status">Loading Moonie’s Fun Farm…</p><a id="fallback" href="previous.html" hidden>Play the previous version</a><noscript>Enable JavaScript to play.</noscript></main>
<script>
(async () => {
  const status = document.getElementById('status');
  try {
    const parts = await Promise.all(Array.from({length: 11}, async (_, i) => {
      const file = String(i).padStart(2, '0') + '.bin';
      const result = await fetch('./release-20261125/' + file);
      if (!result.ok) throw new Error('Could not load game data');
      return result.arrayBuffer();
    }));
    if (parts.reduce((total, part) => total + part.byteLength, 0) !== 23577597) {
      throw new Error('Game download was incomplete');
    }
    const decoder = new TextDecoder('utf-8', {fatal:true});
    const source = parts.map(part => decoder.decode(part, {stream:true})).join('') + decoder.decode();
    document.open();
    document.write(source);
    document.close();
  } catch (error) {
    status.textContent = 'The update couldn’t load.';
    document.getElementById('fallback').hidden = false;
  }
})();
</script></body></html>
