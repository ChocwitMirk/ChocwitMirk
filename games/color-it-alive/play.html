<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color It Alive! · Loading</title>
<style>body{margin:0;background:#e5f5e5;color:#245c53;font:700 18px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center}a{color:#176b5f}</style>
</head><body><main id="loading">🎨 Opening Color It Alive!…</main>
<script>
(async function(){
  try{
    const response=await fetch('index.html',{cache:'no-store'});
    if(!response.ok)throw Error('Game file unavailable');
    let html=await response.text();
    const css=String.raw`
/* iPhone and iPad: stop text selection, touch callout, and page swipes while drawing. */
.modal.open,.modal.open *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent}
.modal.open input:not([type="range"]),.modal.open textarea{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
#paintCanvas,#pagePaintCanvas{touch-action:none!important;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;overscroll-behavior:none;display:block}
.modal.open .modal-inner{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
`;
    if(!html.includes('</style></head>'))throw Error('Game stylesheet not found');
    html=html.replace('</style></head>',css+'</style></head>');
    function replaceBetween(first,last,replacement){
      const i=html.indexOf(first),j=html.indexOf(last,i);
      if(i<0||j<=i)throw Error('Game touch controls changed');
      html=html.slice(0,i)+replacement+html.slice(j);
    }
    replaceBetween("paintCanvas.addEventListener('pointerdown'","function paintUndo()",String.raw`
let paintTouchIdentifier=null;
function paintStart(point){if(!paintReady)return;paintHistory.push(paintLayer.toDataURL('image/png'));if(paintHistory.length>11)paintHistory.shift();painting=true;paintLast=paintPosition(point);paintSegment(paintLast,paintLast)}
function paintMove(point){if(!painting||!paintLast)return;const p=paintPosition(point);paintSegment(paintLast,p);paintLast=p}
function paintEnd(){painting=false;paintLast=null}
paintCanvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||!paintReady)return;e.preventDefault();try{paintCanvas.setPointerCapture(e.pointerId)}catch(_){}paintStart(e)});
paintCanvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!painting)return;e.preventDefault();paintMove(e)});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])paintCanvas.addEventListener(ev,e=>{if(e.pointerType!=='touch')paintEnd()});
paintCanvas.addEventListener('touchstart',e=>{if(!paintReady)return;e.preventDefault();e.stopPropagation();if(paintTouchIdentifier!==null)return;const touch=e.changedTouches[0];if(!touch)return;paintTouchIdentifier=touch.identifier;const s=window.getSelection?.();if(s?.rangeCount)s.removeAllRanges();paintStart(touch)},{passive:false});
paintCanvas.addEventListener('touchmove',e=>{if(paintTouchIdentifier===null)return;e.preventDefault();e.stopPropagation();const touch=Array.from(e.changedTouches).find(t=>t.identifier===paintTouchIdentifier);if(touch)paintMove(touch)},{passive:false});
function paintTouchEnd(e){if(paintTouchIdentifier===null)return;const touch=Array.from(e.changedTouches).find(t=>t.identifier===paintTouchIdentifier);if(!touch)return;e.preventDefault();e.stopPropagation();paintTouchIdentifier=null;paintEnd()}
paintCanvas.addEventListener('touchend',paintTouchEnd,{passive:false});
paintCanvas.addEventListener('touchcancel',paintTouchEnd,{passive:false});
`);
    replaceBetween("  pageCanvas.addEventListener('pointerdown'","  $('closePagePaint').addEventListener",String.raw`
  let pageTouchIdentifier=null;
  function pageStart(point){if(!pageBaseImg)return;pageHistory.push(pageOverlay.toDataURL('image/png'));if(pageHistory.length>12)pageHistory.shift();pagePainting=true;pageLast=pagePos(point);pageSeg(pageLast,pageLast)}
  function pageMove(point){if(!pagePainting||!pageLast)return;const p=pagePos(point);pageSeg(pageLast,p);pageLast=p}
  function pageEnd(){pagePainting=false;pageLast=null}
  pageCanvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||!pageBaseImg)return;e.preventDefault();try{pageCanvas.setPointerCapture(e.pointerId)}catch(_){}pageStart(e)});
  pageCanvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!pagePainting)return;e.preventDefault();pageMove(e)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>pageCanvas.addEventListener(ev,e=>{if(e.pointerType!=='touch')pageEnd()}));
  pageCanvas.addEventListener('touchstart',e=>{if(!pageBaseImg)return;e.preventDefault();e.stopPropagation();if(pageTouchIdentifier!==null)return;const touch=e.changedTouches[0];if(!touch)return;pageTouchIdentifier=touch.identifier;const s=window.getSelection?.();if(s?.rangeCount)s.removeAllRanges();pageStart(touch)},{passive:false});
  pageCanvas.addEventListener('touchmove',e=>{if(pageTouchIdentifier===null)return;e.preventDefault();e.stopPropagation();const touch=Array.from(e.changedTouches).find(t=>t.identifier===pageTouchIdentifier);if(touch)pageMove(touch)},{passive:false});
  function pageTouchEnd(e){if(pageTouchIdentifier===null)return;const touch=Array.from(e.changedTouches).find(t=>t.identifier===pageTouchIdentifier);if(!touch)return;e.preventDefault();e.stopPropagation();pageTouchIdentifier=null;pageEnd()}
  pageCanvas.addEventListener('touchend',pageTouchEnd,{passive:false});
  pageCanvas.addEventListener('touchcancel',pageTouchEnd,{passive:false});
`);
    html=html.replace('</body></html>','<scr'+'ipt src="iphone-guard.js?v=2"></scr'+'ipt></body></html>');
    document.open();document.write(html);document.close();
  }catch(error){
    document.getElementById('loading').innerHTML='Unable to open the updated version.<p><a href="index.html">Open the original game</a></p>';
  }
})();
</script></body></html>
